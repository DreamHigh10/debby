<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AccounTutor — 2nd Year Accounting Mastery</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink:#0f0e0c; --cream:#faf7f2; --gold:#c8973a; --gold-light:#e8c47a;
  --teal:#1a6b6b; --teal-light:#2a9a9a; --rust:#b84a2e; --slate:#3a4a5a;
  --muted:#8a8a8a; --border:#e0d9cf; --card:#ffffff; --sw:280px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;overflow-x:hidden;}

/* SIDEBAR */
#sidebar{position:fixed;top:0;left:0;width:var(--sw);height:100vh;background:var(--ink);display:flex;flex-direction:column;z-index:100;overflow-y:auto;transition:transform .3s;}
.sb-head{padding:24px 22px 18px;border-bottom:1px solid rgba(255,255,255,.1);}
.sb-logo{font-family:'Playfair Display',serif;font-size:1.45rem;font-weight:900;color:var(--gold);}
.sb-sub{font-size:.68rem;color:rgba(255,255,255,.35);margin-top:3px;letter-spacing:1.4px;text-transform:uppercase;}
.prog-wrap{padding:14px 22px;border-bottom:1px solid rgba(255,255,255,.07);}
.prog-lbl{font-size:.68rem;color:rgba(255,255,255,.35);letter-spacing:1px;text-transform:uppercase;margin-bottom:7px;}
.prog-bar{height:4px;background:rgba(255,255,255,.1);border-radius:2px;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--teal-light),var(--gold));border-radius:2px;transition:width .5s;}
.prog-pct{font-size:.72rem;color:var(--gold);margin-top:4px;}
.nav-sec{padding:10px 0;}
.nav-sec-lbl{font-size:.63rem;letter-spacing:1.6px;text-transform:uppercase;color:rgba(255,255,255,.22);padding:0 22px 7px;}
.ni{display:flex;align-items:center;gap:9px;padding:9px 22px;cursor:pointer;font-size:.8rem;color:rgba(255,255,255,.5);transition:all .2s;border-left:3px solid transparent;line-height:1.3;}
.ni:hover{color:#fff;background:rgba(255,255,255,.04);}
.ni.active{color:var(--gold);border-left-color:var(--gold);background:rgba(200,151,58,.08);}
.ni .ico{font-size:.95rem;width:19px;text-align:center;flex-shrink:0;}
.ni .dbadge{margin-left:auto;width:15px;height:15px;background:var(--teal);border-radius:50%;font-size:.58rem;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* MAIN */
#main{margin-left:var(--sw);min-height:100vh;display:flex;flex-direction:column;}
#topbar{position:sticky;top:0;z-index:50;background:rgba(250,247,242,.93);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 36px;display:flex;align-items:center;gap:14px;}
.hamburger{display:none;cursor:pointer;font-size:1.2rem;}
.bread{font-size:.78rem;color:var(--muted);}
.bread span{color:var(--ink);font-weight:600;}
.xp-pill{margin-left:auto;background:linear-gradient(135deg,var(--gold),#e8a030);color:#fff;font-size:.7rem;font-weight:700;padding:4px 12px;border-radius:20px;letter-spacing:.4px;}
#content{flex:1;padding:44px 44px 80px;max-width:920px;}

/* HOME */
.home-hero{background:linear-gradient(135deg,var(--ink) 0%,var(--slate) 100%);border-radius:18px;padding:48px 44px;position:relative;overflow:hidden;margin-bottom:36px;}
.home-hero::before{content:'₦';position:absolute;right:30px;top:10px;font-size:220px;color:rgba(255,255,255,.03);font-family:'Playfair Display',serif;font-weight:900;line-height:1;}
.home-hero h1{font-family:'Playfair Display',serif;font-size:2.4rem;font-weight:900;color:#fff;line-height:1.15;margin-bottom:12px;}
.home-hero h1 em{color:var(--gold);font-style:normal;}
.home-hero p{color:rgba(255,255,255,.6);font-size:.95rem;line-height:1.7;max-width:520px;}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px;margin-bottom:36px;}
.tc{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;cursor:pointer;transition:all .25s;}
.tc:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.09);border-color:var(--gold);}
.tc .tci{font-size:1.8rem;margin-bottom:10px;}
.tc h3{font-size:.92rem;font-weight:600;margin-bottom:5px;}
.tc p{font-size:.75rem;color:var(--muted);line-height:1.5;}
.tc .tc-bar{height:3px;background:var(--border);border-radius:2px;margin-top:12px;}
.tc .tc-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--teal),var(--gold));}

/* LESSON */
.lhd{margin-bottom:30px;}
.ltag{display:inline-block;font-size:.68rem;letter-spacing:1.4px;text-transform:uppercase;background:var(--teal);color:#fff;padding:3px 9px;border-radius:4px;margin-bottom:12px;}
.lhd h1{font-family:'Playfair Display',serif;font-size:2rem;font-weight:900;line-height:1.2;margin-bottom:10px;}
.lhd .ldesc{font-size:.92rem;color:var(--slate);line-height:1.7;}
.tab-strip{display:flex;gap:6px;border-bottom:2px solid var(--border);margin-bottom:28px;}
.lt{padding:9px 15px;font-size:.8rem;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;color:var(--muted);transition:all .2s;font-weight:500;}
.lt:hover{color:var(--ink);}
.lt.active{color:var(--teal);border-bottom-color:var(--teal);}

/* CONTENT BLOCKS */
.sb{margin-bottom:32px;}
.sb h2{font-family:'Playfair Display',serif;font-size:1.35rem;font-weight:700;margin-bottom:12px;padding-bottom:7px;border-bottom:1px solid var(--border);}
.sb h3{font-size:.95rem;font-weight:600;margin:18px 0 7px;color:var(--teal);}
.sb h4{font-size:.85rem;font-weight:600;margin:14px 0 5px;color:var(--slate);}
.sb p{font-size:.87rem;line-height:1.8;color:#2a2a2a;margin-bottom:8px;}
.sb ul,.sb ol{padding-left:18px;margin-bottom:9px;}
.sb li{font-size:.87rem;line-height:1.7;color:#2a2a2a;margin-bottom:3px;}

.callout{border-left:4px solid var(--gold);background:rgba(200,151,58,.07);padding:14px 18px;border-radius:0 9px 9px 0;margin:16px 0;}
.callout.teal{border-left-color:var(--teal);background:rgba(26,107,107,.07);}
.callout.rust{border-left-color:var(--rust);background:rgba(184,74,46,.07);}
.callout.blue{border-left-color:#3a6ea5;background:rgba(58,110,165,.07);}
.callout strong{display:block;font-size:.72rem;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px;color:var(--gold);}
.callout.teal strong{color:var(--teal);}
.callout.rust strong{color:var(--rust);}
.callout.blue strong{color:#3a6ea5;}
.callout p{font-size:.86rem;margin:0;}

.fbox{background:var(--ink);color:var(--gold-light);font-family:'DM Mono',monospace;padding:16px 20px;border-radius:11px;font-size:.83rem;margin:14px 0;line-height:1.8;}
.fbox .cm{color:rgba(255,255,255,.3);}
.fbox .hl{color:#7dd3c8;}

.acc-t{width:100%;border-collapse:collapse;margin:14px 0;font-size:.8rem;}
.acc-t th{background:var(--ink);color:var(--gold);padding:9px 12px;text-align:left;font-weight:600;font-family:'DM Mono',monospace;letter-spacing:.3px;}
.acc-t td{padding:8px 12px;border-bottom:1px solid var(--border);font-family:'DM Mono',monospace;}
.acc-t tr:nth-child(even) td{background:rgba(0,0,0,.02);}
.acc-t .tot td{font-weight:700;border-top:2px solid var(--ink);background:rgba(200,151,58,.06)!important;}
.dr{color:var(--teal);}.cr{color:var(--rust);}

/* STEP-BY-STEP CALC */
.calc-steps{counter-reset:step;margin:16px 0;}
.step{display:flex;gap:14px;margin-bottom:14px;align-items:flex-start;}
.step-num{flex-shrink:0;width:28px;height:28px;background:var(--teal);color:#fff;border-radius:50%;font-size:.75rem;font-weight:700;display:flex;align-items:center;justify-content:center;}
.step-body{flex:1;}
.step-body strong{display:block;font-size:.83rem;font-weight:600;margin-bottom:4px;}
.step-body p{font-size:.82rem;color:#333;margin:0;line-height:1.6;}
.step-result{background:rgba(26,107,107,.08);border:1px solid rgba(26,107,107,.2);border-radius:7px;padding:8px 12px;margin-top:6px;font-family:'DM Mono',monospace;font-size:.82rem;color:var(--teal);font-weight:600;}

/* PRACTICE EXERCISE */
.ex-box{background:#fff;border:2px solid var(--border);border-radius:14px;padding:24px;margin-bottom:24px;}
.ex-box .ex-hd{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.ex-box .ex-hd .ex-num{background:var(--gold);color:#fff;font-weight:700;font-size:.8rem;padding:4px 10px;border-radius:6px;}
.ex-box .ex-hd h3{font-size:1rem;font-weight:700;color:var(--ink);}
.ex-box .ex-data{background:var(--cream);border-radius:8px;padding:14px 16px;margin-bottom:16px;font-size:.83rem;line-height:1.7;}
.ex-box .ex-data strong{display:block;font-size:.72rem;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}

.inp-group{margin-bottom:12px;}
.inp-group label{display:block;font-size:.78rem;font-weight:600;color:var(--slate);margin-bottom:5px;}
.inp-group input{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:'DM Mono',monospace;font-size:.85rem;background:#fff;transition:border .2s;outline:none;}
.inp-group input:focus{border-color:var(--teal);}
.inp-group input.correct{border-color:var(--teal);background:rgba(26,107,107,.06);}
.inp-group input.wrong{border-color:var(--rust);background:rgba(184,74,46,.05);}
.inp-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;}

.btn-check{background:var(--teal);color:#fff;border:none;padding:10px 22px;border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer;transition:background .2s;margin-top:6px;}
.btn-check:hover{background:var(--teal-light);}
.btn-reveal{background:transparent;color:var(--muted);border:1.5px solid var(--border);padding:10px 18px;border-radius:8px;font-size:.78rem;cursor:pointer;transition:all .2s;margin-top:6px;margin-left:8px;}
.btn-reveal:hover{border-color:var(--slate);color:var(--ink);}
.ex-fb{margin-top:12px;padding:12px 16px;border-radius:9px;font-size:.83rem;display:none;line-height:1.7;}
.ex-fb.ok{background:rgba(26,107,107,.09);color:var(--teal);border:1px solid rgba(26,107,107,.2);}
.ex-fb.no{background:rgba(184,74,46,.07);color:var(--rust);border:1px solid rgba(184,74,46,.15);}
.ex-fb.show{display:block;}
.sol-panel{display:none;margin-top:14px;border-top:1px dashed var(--border);padding-top:14px;}
.sol-panel.open{display:block;}

/* QUIZ */
.quiz-wrap{margin-top:8px;}
.quiz-q{margin-bottom:24px;}
.quiz-q p{font-size:.9rem;font-weight:600;margin-bottom:12px;line-height:1.5;}
.qopt{display:flex;align-items:flex-start;gap:9px;padding:11px 14px;border:1.5px solid var(--border);border-radius:9px;margin-bottom:7px;cursor:pointer;transition:all .2s;font-size:.85rem;}
.qopt:hover{border-color:var(--teal);background:rgba(26,107,107,.03);}
.qopt.correct{border-color:var(--teal);background:rgba(26,107,107,.09);}
.qopt.wrong{border-color:var(--rust);background:rgba(184,74,46,.07);}
.qopt input{margin-top:2px;accent-color:var(--teal);}
.q-fb{font-size:.8rem;margin-top:5px;padding:9px 13px;border-radius:7px;}
.q-fb.ok{background:rgba(26,107,107,.09);color:var(--teal);}
.q-fb.no{background:rgba(184,74,46,.07);color:var(--rust);}
.btn-sub{background:var(--ink);color:var(--gold);border:none;padding:11px 26px;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;transition:background .2s;margin-top:6px;}
.btn-sub:hover{background:var(--slate);}
.btn-next{display:inline-flex;align-items:center;gap:6px;background:var(--teal);color:#fff;border:none;padding:12px 26px;border-radius:9px;font-size:.85rem;font-weight:600;cursor:pointer;transition:background .2s;margin-top:16px;}
.btn-next:hover{background:var(--teal-light);}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
.page-enter{animation:fadeUp .35s ease both;}

/* RESPONSIVE */
@media(max-width:768px){
  :root{--sw:0px;}
  #sidebar{transform:translateX(-280px);width:280px;}
  #sidebar.open{transform:translateX(0);}
  #main{margin-left:0;}
  #content{padding:20px 16px 60px;}
  #topbar{padding:11px 16px;}
  .hamburger{display:block;}
  .home-hero{padding:28px 20px;}
  .home-hero h1{font-size:1.7rem;}
  .topic-grid{grid-template-columns:1fr 1fr;}
  .inp-row{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<nav id="sidebar">
  <div class="sb-head">
    <div class="sb-logo">AccounTutor</div>
    <div class="sb-sub">2nd Year Accounting</div>
  </div>
  <div class="prog-wrap">
    <div class="prog-lbl">Course Progress</div>
    <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
    <div class="prog-pct" id="progPct">0% Complete</div>
  </div>
  <div class="nav-sec">
    <div class="nav-sec-lbl">Overview</div>
    <div class="ni active" onclick="show('home')" id="nav-home"><span class="ico">🏠</span> Dashboard</div>
  </div>
  <div class="nav-sec">
    <div class="nav-sec-lbl">Topics</div>
    <div class="ni" onclick="show('royalty')" id="nav-royalty"><span class="ico">👑</span> Royalty Accounts</div>
    <div class="ni" onclick="show('voyage')" id="nav-voyage"><span class="ico">⚓</span> Account of Voyage</div>
    <div class="ni" onclick="show('investment')" id="nav-investment"><span class="ico">📈</span> Investment Accounts</div>
    <div class="ni" onclick="show('partnership')" id="nav-partnership"><span class="ico">🤝</span> Partnership Accounts</div>
    <div class="ni" onclick="show('contracts')" id="nav-contracts"><span class="ico">📋</span> Contract Accounts</div>
    <div class="ni" onclick="show('goodwill')" id="nav-goodwill"><span class="ico">✨</span> Account for Goodwill</div>
    <div class="ni" onclick="show('company')" id="nav-company"><span class="ico">🏢</span> Company Accounts</div>
    <div class="ni" onclick="show('inventory')" id="nav-inventory"><span class="ico">📦</span> Inventory Accounts</div>
  </div>
</nav>

<!-- MAIN -->
<div id="main">
  <div id="topbar">
    <span class="hamburger" onclick="toggleSB()">☰</span>
    <div class="bread" id="bread">Dashboard</div>
    <div class="xp-pill" id="xpBadge">⭐ 0 XP</div>
  </div>
  <div id="content"></div>
</div>

<script>
/* ================================================================
   STATE
   ================================================================ */
const TOPICS = ['royalty','voyage','investment','partnership','contracts','goodwill','company','inventory'];
const S = {
  page:'home',
  done: JSON.parse(localStorage.getItem('ac_done')||'{}'),
  xp:   parseInt(localStorage.getItem('ac_xp')||'0')
};
function save(){ localStorage.setItem('ac_done',JSON.stringify(S.done)); localStorage.setItem('ac_xp',S.xp); }
function markDone(t){ if(!S.done[t]){ S.done[t]=true; S.xp+=100; save(); updateProg(); addBadge(t); } }
function addBadge(t){ const el=document.getElementById('nav-'+t); if(el&&!el.querySelector('.dbadge')){ const b=document.createElement('span'); b.className='dbadge'; b.textContent='✓'; el.appendChild(b); } }
function updateProg(){
  const d=TOPICS.filter(t=>S.done[t]).length;
  const p=Math.round(d/TOPICS.length*100);
  document.getElementById('progFill').style.width=p+'%';
  document.getElementById('progPct').textContent=p+'% Complete';
  document.getElementById('xpBadge').textContent='⭐ '+S.xp+' XP';
}

/* ================================================================
   ROUTING
   ================================================================ */
const LABELS={home:'Dashboard',royalty:'Royalty Accounts',voyage:'Account of Voyage',investment:'Investment Accounts',partnership:'Partnership Accounts',contracts:'Contract Accounts',goodwill:'Account for Goodwill',company:'Company Accounts',inventory:'Inventory Accounts'};
function show(p){
  S.page=p;
  document.querySelectorAll('.ni').forEach(el=>el.classList.remove('active'));
  const nav=document.getElementById('nav-'+p); if(nav) nav.classList.add('active');
  document.getElementById('bread').innerHTML = p==='home'?'Dashboard':`Topics → <span>${LABELS[p]}</span>`;
  const c=document.getElementById('content');
  c.innerHTML=PAGES[p]();
  c.className='page-enter';
  if(window.innerWidth<768) document.getElementById('sidebar').classList.remove('open');
  window.scrollTo(0,0);
}
function toggleSB(){ document.getElementById('sidebar').classList.toggle('open'); }

/* ================================================================
   TAB SYSTEM
   ================================================================ */
function tab(t){
  document.querySelectorAll('.lt').forEach(el=>el.classList.toggle('active',el.dataset.t===t));
  document.querySelectorAll('[data-panel]').forEach(el=>el.style.display=el.dataset.panel===t?'block':'none');
}

/* ================================================================
   PRACTICE EXERCISE ENGINE
   ================================================================ */
function checkEx(id, answers, tol){
  tol = tol||0.5;
  const inputs = document.querySelectorAll(`#ex-${id} input`);
  let allOk=true;
  inputs.forEach(inp=>{
    const key=inp.dataset.key;
    const expected=answers[key];
    if(expected===undefined) return;
    const val=parseFloat(inp.value.replace(/,/g,''));
    const ok=Math.abs(val-expected)<=tol;
    inp.classList.toggle('correct',ok);
    inp.classList.toggle('wrong',!ok);
    if(!ok) allOk=false;
  });
  const fb=document.getElementById(`fb-${id}`);
  fb.className='ex-fb show '+(allOk?'ok':'no');
  fb.innerHTML=allOk
    ? '✅ <strong>Excellent!</strong> All answers are correct. +20 XP earned!'
    : '❌ Some answers need review. Check highlighted fields or click "Show Solution".';
  if(allOk){ S.xp+=20; save(); updateProg(); }
}
function toggleSol(id){
  const p=document.getElementById(`sol-${id}`);
  p.classList.toggle('open');
  const btn=document.getElementById(`sbtn-${id}`);
  btn.textContent=p.classList.contains('open')?'Hide Solution':'Show Solution';
}

/* ================================================================
   QUIZ ENGINE
   ================================================================ */
const QUIZZES = {
  royalty:[
    {q:"Short-working occurs when:",opts:["Actual royalty > Minimum rent","Actual royalty < Minimum rent","Output equals zero","None of the above"],a:1,e:"Short-working = Minimum Rent − Actual Royalty. It occurs when actual earned royalty is less than the guaranteed minimum."},
    {q:"Unrecouped short-working at the end of the recoupment period is:",opts:["Carried forward indefinitely","Written off to Profit & Loss Account","Deducted from the lessor's income","Added to minimum rent"],a:1,e:"Short-working not recovered within the allowed period is a loss — debited to P&L Account."},
    {q:"In the lessor's books, royalty income is credited to:",opts:["Short-working Account","Royalty Receivable Account","Lessee's Account","Capital Account"],a:1,e:"Royalty income is credited to the Royalty Receivable (Income) Account in the lessor's books."},
    {q:"Recoupment of short-working in a lessee's books is recorded as:",opts:["Dr Royalty A/c Cr Short-working A/c","Dr Short-working A/c Cr Landlord A/c","Dr Landlord A/c Cr Short-working A/c","Dr P&L A/c Cr Short-working A/c"],a:2,e:"Recoupment: Debit Landlord/Lessor A/c (reducing amount paid) and Credit Short-working A/c (clearing the asset)."},
    {q:"The minimum rent clause in a royalty agreement primarily protects:",opts:["The lessee","The government","The lessor/landlord","Both parties equally"],a:2,e:"Minimum rent (dead rent) guarantees the lessor a minimum income regardless of the lessee's output level."}
  ],
  voyage:[
    {q:"Dead freight in a voyage account is:",opts:["Freight charged for empty return journey","Compensation paid when a shipper books but fails to provide full cargo","Freight earned on goods not yet delivered","Port demurrage charges"],a:1,e:"Dead freight is compensation received when a charterer books cargo space but fails to fill it — it is income."},
    {q:"In an incomplete voyage at year-end, freight income is recognised:",opts:["In full when the voyage starts","Proportionally based on the stage of completion","Only when cash is received","In the next accounting period"],a:1,e:"Accrual accounting requires freight income to be recognised proportionally as the voyage progresses."},
    {q:"Stevedoring charges in a voyage account are:",opts:["An income item","A capital expenditure","A voyage expense (loading/unloading costs)","Deferred to next period"],a:2,e:"Stevedoring refers to loading and unloading cargo — a direct voyage operating expense."},
    {q:"Depreciation of a vessel in a voyage account is:",opts:["Excluded — it is a company-wide charge","Time-apportioned to the voyage duration","Based on cargo carried","Charged at the full annual amount"],a:1,e:"Only the depreciation applicable to the voyage's duration is charged to that voyage account."}
  ],
  investment:[
    {q:"Under IFRS 9, a bond held to collect contractual cash flows only is classified as:",opts:["FVTPL","FVOCI","Amortised Cost","Available-for-sale"],a:2,e:"The 'collect contractual cash flows' business model with SPPI test = Amortised Cost classification under IFRS 9."},
    {q:"Under the equity method, dividends received from the associate are:",opts:["Credited to Investment Income","Deducted from the carrying value of the investment","Added to the investment's cost","Ignored"],a:1,e:"Dividends reduce the carrying amount of the investment under the equity method — they represent a return of investment, not income."},
    {q:"Bond discount amortisation under the EIR method results in:",opts:["Decreasing interest income each year","Increasing interest income each year","Constant interest income","No change to carrying value"],a:1,e:"For a discount bond, carrying value increases each year. Higher carrying value × EIR = increasing interest income."},
    {q:"A fair value gain on FVTPL equity investments is recognised in:",opts:["Other Comprehensive Income","Share Premium","Profit or Loss","Retained Earnings directly"],a:0,e:"FVTPL gains/losses go through Profit or Loss immediately — that is the defining feature of this classification."}
  ],
  partnership:[
    {q:"In the absence of a partnership deed, the Partnership Act provides that profits are shared:",opts:["In capital ratio","In proportion to time worked","Equally","In sales generated ratio"],a:2,e:"Default rule under the Partnership Act: equal profit-sharing when no deed specifies the ratio."},

function submitQuiz(topic){
  const qs=QUIZZES[topic]; let sc=0;
  qs.forEach((q,i)=>{
    const sel=document.querySelector(`input[name="qq${i}"]:checked`);
    if(!sel) return;
    const ans=parseInt(sel.value);
    document.querySelectorAll(`.qopt[data-qi="${i}"]`).forEach((el,j)=>{
      if(j===q.a) el.classList.add('correct');
      else if(j===ans&&j!==q.a) el.classList.add('wrong');
    });
    document.querySelectorAll(`input[name="qq${i}"]`).forEach(r=>r.disabled=true);
    const fb=document.getElementById('qfb'+i);
    if(ans===q.a){ sc++; fb.innerHTML=`<div class="q-fb ok">✅ ${q.e}</div>`; }
    else fb.innerHTML=`<div class="q-fb no">❌ Correct: <strong>${q.opts[q.a]}</strong>. ${q.e}</div>`;
  });
  const gained=sc*20; S.xp+=gained; save(); updateProg();
  document.getElementById('qr').innerHTML=`<div class="callout teal"><strong>Quiz Result</strong><p>Score: <strong>${sc}/${qs.length}</strong> — +${gained} XP! ${sc===qs.length?'🎉 Perfect!':sc>=qs.length/2?'👏 Good work!':'📚 Review and retry.'}</p></div>`;
  document.getElementById('qsub')?.remove();
  if(sc>=qs.length/2) markDone(topic);
}

function buildQuiz(topic){
  const qs=QUIZZES[topic];
  let h=`<div class="sb"><h2>🎯 Quiz</h2><p>Answer all questions, then submit for instant feedback and XP.</p></div><div class="quiz-wrap">`;
  qs.forEach((q,i)=>{
    h+=`<div class="quiz-q"><p>${i+1}. ${q.q}</p>`;
    q.opts.forEach((o,j)=>{ h+=`<label class="qopt" data-qi="${i}"><input type="radio" name="qq${i}" value="${j}"> ${o}</label>`; });
    h+=`<div id="qfb${i}"></div></div>`;
  });
  h+=`<div id="qr"></div><button class="btn-sub" id="qsub" onclick="submitQuiz('${topic}')">Submit Answers</button></div>`;
  return h;
}

function shell(topic,icon,title,desc,learn,practice){
  return `<div class="lhd"><span class="ltag">${icon} Topic</span><h1>${title}</h1><p class="ldesc">${desc}</p></div>
  <div class="tab-strip">
    <div class="lt active" data-t="learn" onclick="tab('learn')">📖 Theory & Calculations</div>
    <div class="lt" data-t="practice" onclick="tab('practice')">🧪 Practice Exercises</div>
    <div class="lt" data-t="quiz" onclick="tab('quiz')">🎯 Quiz</div>
  </div>
  <div data-panel="learn">${learn}</div>
  <div data-panel="practice" style="display:none">${practice}</div>
  <div data-panel="quiz" style="display:none">${buildQuiz(topic)}</div>`;
}

  <div class="callout"><strong>Depreciation Calculation</strong><p>Annual depreciation = ₦120,000. Voyage duration = 45 days. Charge = 45/365 × 120,000 = <strong>₦14,795</strong></p></div>
</div>
<div class="sb"><h2>Incomplete Voyages at Year-End</h2>
  <div class="fbox">
<span class="hl">Proportion Completed</span> = Days elapsed to year-end ÷ Total voyage days
<span class="hl">Freight Recognised</span>   = Total Freight × Proportion Completed
<span class="hl">Expenses to Charge</span>   = Actual expenses incurred to date (direct)
                        OR  Total estimated × Proportion (for accrued items)
<span class="hl">WIP Balance</span>          = Revenue earned to date − Expenses to date</div>
  <h3>Worked Example — Incomplete Voyage</h3>
  <p>Voyage begins Dec 1 and ends Jan 15 (46 days total). Year-end = Dec 31 (31 days completed). Total freight = ₦200,000. Total voyage costs = ₦120,000 (accruing evenly).</p>

    <div class="step"><div class="step-num">2</div><div class="step-body"><strong>Freight earned to Dec 31</strong><div class="step-result">₦200,000 × 67.4% = ₦134,800 (accrued income)</div></div></div>
    <div class="step"><div class="step-num">3</div><div class="step-body"><strong>Costs to Dec 31</strong><div class="step-result">₦120,000 × 67.4% = ₦80,880 (charged to P&L)</div></div></div>
    <div class="step"><div class="step-num">4</div><div class="step-body"><strong>WIP carried forward</strong><div class="step-result">₦134,800 − ₦80,880 = ₦53,920 net WIP → Current Asset</div></div></div>
  </div>
</div>`,

investment:()=>shell('investment','📈','Investment Accounts',
'Recording and measuring financial assets — bonds, equity shares, and associates — under IFRS 9 and the equity method.',
/* LEARN */`
<div class="sb"><h2>Bond Investment — EIR (Amortised Cost)</h2>
  <div class="fbox">
<span class="hl">Interest Income</span>  = Opening Carrying Value × Effective Interest Rate (EIR)
<span class="hl">Cash Received</span>    = Face Value × Coupon Rate
<span class="hl">Amortisation</span>     = Interest Income − Cash Received
  <span class="cm">  (positive = discount bond; negative = premium bond)</span>
<span class="hl">Closing CV</span>       = Opening CV + Amortisation</div>
  <h3>Example: Discount Bond</h3>
  <p>Bond: Face ₦100,000 | Coupon 6% | EIR 8% | 3 years | Purchased at ₦94,845</p>
  <table class="acc-t">
    <tr><th>Year</th><th>Open CV</th><th>Interest Inc (8%)</th><th>Cash (6%)</th><th>Amortisation</th><th>Close CV</th></tr>
    <tr><td>1</td><td>94,845</td><td class="dr">7,588</td><td class="cr">6,000</td><td class="dr">+1,588</td><td>96,433</td></tr>
    <tr><td>2</td><td>96,433</td><td class="dr">7,715</td><td class="cr">6,000</td><td class="dr">+1,715</td><td>98,148</td></tr>
    <tr><td>3</td><td>98,148</td><td class="dr">7,852</td><td class="cr">6,000</td><td class="dr">+1,852</td><td>100,000</td></tr>
  </table>
  <h3>Example: Premium Bond</h3>
  <p>Bond: Face ₦100,000 | Coupon 8% | EIR 6% | 3 years | Purchased at ₦105,346</p>
  <table class="acc-t">
    <tr><th>Year</th><th>Open CV</th><th>Interest Inc (6%)</th><th>Cash (8%)</th><th>Amortisation</th><th>Close CV</th></tr>
    <tr><td>1</td><td>105,346</td><td class="dr">6,321</td><td class="cr">8,000</td><td class="cr">−1,679</td><td>103,667</td></tr>
    <tr><td>2</td><td>103,667</td><td class="dr">6,220</td><td class="cr">8,000</td><td class="cr">−1,780</td><td>101,887</td></tr>
    <tr><td>3</td><td>101,887</td><td class="dr">6,113</td><td class="cr">8,000</td><td class="cr">−1,887</td><td>100,000</td></tr>
  </table>
</div>
<div class="sb"><h2>Equity Method Calculations</h2>
  <div class="fbox">
<span class="hl">Share of Profit</span>   = Investee's Profit × % Ownership  <span class="cm">→ Increases investment CV</span>
<span class="hl">Dividend Received</span>  = Investee's Dividend × % Ownership  <span class="cm">→ Decreases investment CV</span>
<span class="hl">Closing CV</span>        = Opening CV + Share of Profit − Dividends</div>
  <h3>Worked Example</h3>
  <p>Investor holds 35% in Associate. Associate: Profit = ₦400,000 | Dividends paid = ₦100,000. Opening investment CV = ₦280,000.</p>
  <div class="calc-steps">
    <div class="step"><div class="step-num">1</div><div class="step-body"><strong>Share of profit</strong><p>35% × ₦400,000</p><div class="step-result">= ₦140,000 → Dr Investment, Cr Investment Income</div></div></div>
    <div class="step"><div class="step-num">2</div><div class="step-body"><strong>Share of dividend</strong><p>35% × ₦100,000</p><div class="step-result">= ₦35,000 → Dr Bank, Cr Investment</div></div></div>
    <div class="step"><div class="step-num">3</div><div class="step-body"><strong>Closing CV</strong><p>280,000 + 140,000 − 35,000</p><div class="step-result">= ₦385,000</div></div></div>
  </div>
</div>`,

partnership:()=>shell('partnership','🤝','Partnership Laws & Accounts',
'Profit appropriation, capital accounts, admission, retirement, and dissolution of partnerships.',
/* LEARN */`
<div class="sb"><h2>P&L Appropriation — Key Formula</h2>
  <div class="fbox">
Net Profit
<span class="cm">LESS:</span>  Partners' Salaries             <span class="cm">(if in deed)</span>
<span class="cm">LESS:</span>  Interest on Capital            <span class="cm">= Capital × Rate</span>
<span class="cm">ADD:</span>   Interest on Drawings          <span class="cm">= Drawings × Rate × Time</span>
= <span class="hl">Residual Profit</span> shared in Profit-Sharing Ratio (PSR)</div>
  <h3>Full Worked Example</h3>
  <p>Partners: Ade (capital ₦100k, PSR 3) and Bola (capital ₦60k, PSR 2). Net Profit = ₦150,000.<br>
  Interest on capital: 8% p.a. | Ade's salary: ₦20,000 | Interest on drawings: Ade ₦1,200; Bola ₦800</p>
  <table class="acc-t">
    <tr><th>Item</th><th>Ade ₦</th><th>Bola ₦</th><th>Total ₦</th></tr>
    <tr><td>Net Profit</td><td></td><td></td><td class="dr">150,000</td></tr>
    <tr><td>Less: Ade's Salary</td><td class="dr">20,000</td><td></td><td class="cr">(20,000)</td></tr>
    <tr><td>Less: Interest on Capital (Ade: 8%×100k; Bola: 8%×60k)</td><td class="dr">8,000</td><td class="dr">4,800</td><td class="cr">(12,800)</td></tr>
    <tr><td>Add: Interest on Drawings</td><td class="cr">1,200</td><td class="cr">800</td><td class="dr">2,000</td></tr>
    <tr><td>Residual Profit</td><td></td><td></td><td class="dr">119,200</td></tr>
    <tr><td>Share of Residual (3:2)</td><td class="dr">71,520</td><td class="dr">47,680</td><td class="cr">(119,200)</td></tr>
    <tr class="tot"><td><strong>Total to Each Partner</strong></td><td class="dr"><strong>99,320</strong></td><td class="dr"><strong>51,680</strong></td><td></td></tr>
  </table>
</div>
<div class="sb"><h2>Admission of a New Partner — Goodwill Calculation</h2>
  <div class="fbox">
<span class="hl">Sacrificing Ratio</span> = Old Share − New Share
Goodwill Dr = New Partner's Capital  <span class="cm">(new partner pays in)</span>
Goodwill Cr = Old Partners in Sacrificing Ratio  <span class="cm">(they receive)</span></div>
  <h3>Example — Admission</h3>
  <p>Ade:Bola = 3:2. Chidi admitted for 1/5 share. Goodwill = ₦50,000. New PSR = Ade:Bola:Chidi = 3:2:1 out of 6 (or re-stated 2:2:1 if sacrificed from old).</p>
  <div class="calc-steps">
    <div class="step"><div class="step-num">1</div><div class="step-body"><strong>Old ratio</strong><p>Ade = 3/5, Bola = 2/5</p></div></div>
    <div class="step"><div class="step-num">2</div><div class="step-body"><strong>Chidi's new share = 1/5. Old partners sacrifice equally.</strong><p>Each gives up 1/2 of 1/5 = 1/10. New: Ade = 3/5−1/10 = 5/10, Bola = 2/5−1/10 = 3/10, Chidi = 2/10. Ratio = 5:3:2</p></div></div>
    <div class="step"><div class="step-num">3</div><div class="step-body"><strong>Goodwill journal</strong><p>Dr Chidi's Capital ₦50,000 (or Dr Bank if cash premium); Cr Ade ₦25,000 (1/2); Cr Bola ₦25,000 (1/2)</p><div class="step-result">Sacrificing ratio = 1:1 (equal sacrifice here)</div></div></div>
  </div>
</div>
<div class="sb"><h2>Dissolution — Realisation Account</h2>
  <div class="fbox">
<span class="hl">Realisation A/c Dr</span> — All assets at book value (except cash/bank)
<span class="hl">Realisation A/c Cr</span> — All liabilities at book value
<span class="hl">Realisation A/c Cr</span> — Proceeds from asset sales
<span class="hl">Realisation Profit/Loss</span> — Shared in PSR among partners</div>
</div>`,

      <div class="step"><div class="step-num">2</div><div class="step-body"><strong>Goodwill credits</strong><p>Ali: 2/3 × 120,000 | Ben: 1/3 × 120,000</p><div class="step-result">Ali = ₦80,000 | Ben = ₦40,000</div></div></div>
      <div class="step"><div class="step-num">3</div><div class="step-body"><strong>Chidi pays goodwill</strong><p>Dr Chidi's Capital / Cash ₦120,000 (full goodwill)</p><div class="step-result">Chidi's goodwill debit = ₦120,000</div></div></div>
    </div>
  </div>
</div>`),

contracts:()=>shell('contracts','📋','Accounting for Contracts',
'Long-term contract revenue recognition under IFRS 15 — stage of completion, WIP, foreseeable losses.',
/* LEARN */`
<div class="sb"><h2>IFRS 15 — Percentage of Completion</h2>
  <div class="fbox">
<span class="hl">Stage of Completion (%)</span> = Costs to Date ÷ Total Estimated Costs × 100

<span class="hl">Cumulative Revenue</span>  = Contract Price × Stage of Completion
<span class="hl">Cumulative Costs</span>    = Costs incurred to date
<span class="hl">Cumulative Profit</span>   = Cumulative Revenue − Cumulative Costs

<span class="cm">For CURRENT YEAR figures, deduct prior cumulative amounts:</span>
<span class="hl">Revenue this year</span>   = Cumulative Revenue − Prior Cumulative Revenue
<span class="hl">Costs this year</span>     = Costs incurred this year (actual)
<span class="hl">Profit this year</span>    = Revenue this year − Costs this year</div>
  <h3>Full 3-Year Worked Example</h3>
  <p><strong>Contract: Price ₦1,500,000 | Estimated Total Cost ₦1,000,000</strong></p>
  <table class="acc-t">
    <tr><th>Item</th><th>Year 1</th><th>Year 2</th><th>Year 3</th></tr>
    <tr><td>Costs to Date</td><td>200,000</td><td>650,000</td><td>1,000,000</td></tr>
    <tr><td>Stage of Completion</td><td>20%</td><td>65%</td><td>100%</td></tr>
    <tr><td>Cumulative Revenue</td><td class="dr">300,000</td><td class="dr">975,000</td><td class="dr">1,500,000</td></tr>
    <tr><td>Revenue This Year</td><td class="dr">300,000</td><td class="dr">675,000</td><td class="dr">525,000</td></tr>
    <tr><td>Costs This Year</td><td class="cr">200,000</td><td class="cr">450,000</td><td class="cr">350,000</td></tr>
    <tr class="tot"><td><strong>Profit This Year</strong></td><td class="dr"><strong>100,000</strong></td><td class="dr"><strong>225,000</strong></td><td class="dr"><strong>175,000</strong></td></tr>
  </table>
</div>
<div class="sb"><h2>Foreseeable Loss</h2>
  <div class="fbox">
If  Total Estimated Costs &gt; Contract Price  →  <span class="hl">Foreseeable Loss</span>
Expected Loss = Total Estimated Costs − Contract Price
<span class="hl">ENTIRE loss recognised immediately</span> in P&L (prudence concept)
Loss already recognised in prior years is deducted first</div>
  <h3>Example — Loss Contract</h3>
  <p>Price ₦500,000 | Revised estimated cost ₦620,000 | Costs to date ₦310,000 (Year 2)</p>
  <div class="calc-steps">
    <div class="step"><div class="step-num">1</div><div class="step-body"><strong>Stage of completion</strong><p>310,000 ÷ 620,000</p><div class="step-result">= 50%</div></div></div>
    <div class="step"><div class="step-num">2</div><div class="step-body"><strong>Total foreseeable loss</strong><p>620,000 − 500,000</p><div class="step-result">= ₦120,000 — RECOGNISE IN FULL</div></div></div>
    <div class="step"><div class="step-num">3</div><div class="step-body"><strong>Revenue Year 2</strong><p>500,000 × 50% = ₦250,000</p></div></div>
    <div class="step"><div class="step-num">4</div><div class="step-body"><strong>Costs Year 2</strong><p>₦310,000 (actual) + ₦120,000 (provision for full loss)</p><div class="step-result">Loss this year = Revenue ₦250k − Costs ₦430k = (₦180,000)</div></div></div>
  </div>
</div>`,

goodwill:()=>shell('goodwill','✨','Account for Goodwill',
'Valuation methods for goodwill — average profits, super profits, capitalisation — and IFRS 3 treatment.',
/* LEARN */`
<div class="sb"><h2>Goodwill Valuation Methods</h2>
  <div class="fbox">
<span class="cm">Method 1: Average Profits</span>
<span class="hl">Goodwill</span> = Average Annual Profit × Years' Purchase

<span class="cm">Method 2: Super-Profits</span>
<span class="hl">Normal Profit</span>  = Capital Employed × Normal Rate of Return
<span class="hl">Super Profit</span>   = Actual Average Profit − Normal Profit
<span class="hl">Goodwill</span>       = Super Profit × Years' Purchase

<span class="cm">Method 3: Capitalisation of Super-Profits</span>
<span class="hl">Goodwill</span>       = Super Profit ÷ Normal Rate of Return × 100

<span class="cm">Method 4: Capitalisation of Average Profits</span>
<span class="hl">Capitalised Value</span> = Average Profit ÷ Normal Rate × 100
<span class="hl">Goodwill</span>           = Capitalised Value − Capital Employed</div>
</div>
<div class="sb"><h2>Worked Examples</h2>
  <h3>Data: Capital Employed = ₦600,000 | Normal Return = 12% | Avg Profit = ₦96,000 | Years' Purchase = 4</h3>
  <div class="calc-steps">
    <div class="step"><div class="step-num">1</div><div class="step-body"><strong>Method 1 — Average Profits</strong><p>96,000 × 4 years</p><div class="step-result">Goodwill = ₦384,000</div></div></div>
    <div class="step"><div class="step-num">2</div><div class="step-body"><strong>Method 2 — Super Profits</strong><p>Normal = 600,000 × 12% = ₦72,000. Super Profit = 96,000 − 72,000 = ₦24,000. Goodwill = 24,000 × 4</p><div class="step-result">Goodwill = ₦96,000</div></div></div>
    <div class="step"><div class="step-num">3</div><div class="step-body"><strong>Method 3 — Capitalisation</strong><p>Super Profit ÷ Rate = 24,000 ÷ 0.12</p><div class="step-result">Goodwill = ₦200,000</div></div></div>
    <div class="step"><div class="step-num">4</div><div class="step-body"><strong>Method 4 — Capitalised Avg Profit</strong><p>Capitalised Value = 96,000 ÷ 0.12 = ₦800,000. Goodwill = 800,000 − 600,000</p><div class="step-result">Goodwill = ₦200,000</div></div></div>
  </div>
  <div class="callout rust"><strong>Note</strong><p>Different methods give different values! Exams usually specify which method to use. Super-profits method is most commonly tested.</p></div>
</div>
<div class="sb"><h2>IFRS 3 — Purchased Goodwill</h2>
  <div class="fbox">
<span class="hl">Goodwill (IFRS 3)</span> = Purchase Consideration − FV of Net Identifiable Assets
Net Identifiable Assets = Identified Assets (at FV) − Identified Liabilities (at FV)

If result is <span class="hl">negative</span> → Bargain purchase → Recognise gain in P&L immediately</div>
</div>`,
/* PRACTICE */`
<div class="ex-box" id="ex-g1">

company:()=>shell('company','🏢','Company Accounts',
'Share capital, debentures, reserves, and company financial statements under CAMA and IFRS.',
/* LEARN */`
<div class="sb"><h2>Key Share Capital Calculations</h2>
  <div class="fbox">
<span class="hl">Share Premium</span>     = (Issue Price − Par Value) × Number of Shares Issued
<span class="hl">Calls in Arrear</span>   = Called-up Capital − Paid-up Capital
<span class="hl">Calls in Advance</span>  = Cash received before call is made

<span class="cm">Bonus (Capitalisation) Issue:</span>
<span class="hl">Shares Issued</span>     = Retained Earnings / Reserve Used ÷ Par Value
Dr Retained Earnings/Share Premium | Cr Share Capital

<span class="cm">Rights Issue:</span>
<span class="hl">New Shares</span>        = Old shares × Rights ratio
<span class="hl">Cash Raised</span>       = New shares × Rights Issue Price</div>
  <h3>Worked Example — Share Issue</h3>
  <p>ABC Ltd issues 500,000 shares of ₦1 par at ₦3.50 per share. 20,000 shares' call-in-arrear on final call of ₦1.</p>
  <div class="calc-steps">
    <div class="step"><div class="step-num">1</div><div class="step-body"><strong>Share Capital raised</strong><p>500,000 × ₦1 par</p><div class="step-result">= ₦500,000</div></div></div>
    <div class="step"><div class="step-num">2</div><div class="step-body"><strong>Share Premium raised</strong><p>500,000 × (₦3.50 − ₦1.00)</p><div class="step-result">= ₦1,250,000</div></div></div>
    <div class="step"><div class="step-num">3</div><div class="step-body"><strong>Calls in Arrear</strong><p>20,000 × ₦1 final call unpaid</p><div class="step-result">= ₦20,000 (deducted from Paid-up Capital)</div></div></div>
    <div class="step"><div class="step-num">4</div><div class="step-body"><strong>Paid-up Capital</strong><p>Called-up = ₦500,000; Less calls in arrear ₦20,000</p><div class="step-result">= ₦480,000</div></div></div>
  </div>
</div>
<div class="sb"><h2>Debenture Interest Calculation</h2>
  <div class="fbox">
<span class="hl">Debenture Interest</span> = Face Value of Debentures × Coupon Rate
This is an <span class="hl">expense</span> in P&L — NOT an appropriation.
Tax is calculated AFTER deducting debenture interest.</div>

    <tr class="tot"><td><strong>Profit After Tax</strong></td><td class="dr"><strong>343,000</strong></td></tr>

</div>`,

inventory:()=>shell('inventory','📦','Inventory Accounts',
'IAS 2 inventory valuation, FIFO and AVCO cost flow methods, NRV write-downs, and COGS calculations.',
/* LEARN */`
<div class="sb"><h2>IAS 2 — Core Measurement</h2>
  <div class="fbox">
<span class="hl">Measurement</span>   = Lower of COST and NRV

<span class="hl">Cost</span>           = Purchase price
                + Import duties + Freight-in
                − Trade discounts
                + Direct conversion costs

<span class="hl">NRV</span>            = Estimated selling price
                − Estimated costs to complete
                − Estimated selling costs

Write-down = Cost − NRV  <span class="cm">(if NRV &lt; Cost → expense immediately)</span></div>
</div>
<div class="sb"><h2>FIFO — First-In, First-Out</h2>
  <p>Oldest units sold first. In rising prices → lower COGS → higher profit → higher closing stock.</p>
  <h3>Full Example</h3>
  <p>Jan 1: Opening 100 units @ ₦10. Jan 10: Buy 200 @ ₦14. Jan 20: Buy 150 @ ₦16. Sell 350 units total.</p>
  <table class="acc-t">
    <tr><th>Units Sold (FIFO)</th><th>Units</th><th>Cost/unit</th><th>Total Cost</th></tr>
    <tr><td>From opening stock</td><td>100</td><td>₦10</td><td class="cr">1,000</td></tr>
    <tr><td>From Jan 10 purchase</td><td>200</td><td>₦14</td><td class="cr">2,800</td></tr>
    <tr><td>From Jan 20 purchase</td><td>50</td><td>₦16</td><td class="cr">800</td></tr>
    <tr class="tot"><td><strong>COGS</strong></td><td><strong>350</strong></td><td></td><td class="cr"><strong>4,600</strong></td></tr>
  </table>
  <p>Closing stock: 100 units @ ₦16 = <strong>₦1,600</strong></p>
</div>
<div class="sb"><h2>AVCO — Weighted Average Cost</h2>
  <div class="fbox">
<span class="hl">New AVCO</span> = (Units in Stock × Old AVCO + New Units × New Price) ÷ Total Units
<span class="hl">COGS</span>     = Units Sold × AVCO at time of sale
<span class="hl">Closing Stock</span> = Remaining Units × AVCO</div>
  <h3>Example (Perpetual AVCO)</h3>
  <p>Same data as FIFO above:</p>
  <div class="calc-steps">
    <div class="step"><div class="step-num">1</div><div class="step-body"><strong>After Jan 10 purchase</strong><p>AVCO = (100×10 + 200×14) ÷ 300 = (1,000+2,800)÷300</p><div class="step-result">= ₦12.67/unit</div></div></div>
    <div class="step"><div class="step-num">2</div><div class="step-body"><strong>After Jan 20 purchase</strong><p>AVCO = (300×12.67 + 150×16) ÷ 450 = (3,800+2,400)÷450</p><div class="step-result">= ₦13.78/unit</div></div></div>
    <div class="step"><div class="step-num">3</div><div class="step-body"><strong>COGS (350 units at new AVCO)</strong><p>350 × ₦13.78</p><div class="step-result">COGS ≈ ₦4,822</div></div></div>
    <div class="step"><div class="step-num">4</div><div class="step-body"><strong>Closing Stock (100 units)</strong><p>100 × ₦13.78</p><div class="step-result">= ₦1,378</div></div></div>
  </div>
</div>
<div class="sb"><h2>COGS Formula (Periodic System)</h2>
  <div class="fbox">
<span class="hl">COGS</span> = Opening Inventory
        + Purchases
        + Carriage Inwards
        − Purchase Returns
        − Closing Inventory</div>
</div>`,
/* PRACTICE */`

  <button class="btn-reveal" id="sbtn-inv1" onclick="toggleSol('inv1')">Show Solution</button>
  <div class="ex-fb" id="fb-inv1"></div>
  <div class="sol-panel" id="sol-inv1">
    <div class="calc-steps">
      <div class="step"><div class="step-num">1</div><div class="step-body"><strong>Total available units</strong><p>50 + 120 + 80 = 250. Sell 180. Remaining = 70.</p></div></div>
      <div class="step"><div class="step-num">2</div><div class="step-body"><strong>FIFO — units sold from opening</strong><p>50 units (all opening stock sold first)</p><div class="step-result">Cost: 50 × ₦20 = ₦1,000</div></div></div>
      <div class="step"><div class="step-num">3</div><div class="step-body"><strong>FIFO — remaining from purchases</strong><p>180 total sold - 50 opening = 130 needed.<br>Take all 120 from Jan 8, then 10 from Jan 15.</p><div class="step-result">COGS = 1,000 + (120 × 25) + (10 × 28) = 1,000 + 3,000 + 280 = ₦4,280</div></div></div>
      <div class="step"><div class="step-num">4</div><div class="step-body"><strong>Closing Stock</strong><p>70 units remaining from Jan 15 @ ₦28</p><div class="step-result">= ₦1,960</div></div></div>
    </div>
  </div>
</div>
<div class="ex-box" id="ex-inv2">

    Product A: Cost ₦45,000 | Expected selling price ₦60,000 | Selling costs ₦8,000<br>
    Product B: Cost ₦30,000 | Expected selling price ₦35,000 | Costs to complete ₦7,000 | Selling costs ₦3,000<br>
    Product C: Cost ₦22,000 | Expected selling price ₦28,000 | Selling costs ₦4,500
  </div>
  <div class="inp-row">

    <div class="inp-group"><label>Product A — Inventory Value (IAS 2) (₦)</label><input data-key="val_a" placeholder=""></div>
    <div class="inp-group"><label>Product B — NRV (₦)</label><input data-key="nrv_b" placeholder=""></div>
    <div class="inp-group"><label>Product B — Inventory Value (IAS 2) (₦)</label><input data-key="val_b" placeholder=""></div>
    <div class="inp-group"><label>Product C — NRV (₦)</label><input data-key="nrv_c" placeholder=""></div>
    <div class="inp-group"><label>Product C — Inventory Value (IAS 2) (₦)</label><input data-key="val_c" placeholder=""></div>
    <div class="inp-group"><label>Total Inventory on Balance Sheet (₦)</label><input data-key="total_inv" placeholder=""></div>
  </div>

  <button class="btn-reveal" id="sbtn-inv2" onclick="toggleSol('inv2')">Show Solution</button>
  <div class="ex-fb" id="fb-inv2"></div>
  <div class="sol-panel" id="sol-inv2">
    <div class="calc-steps">
      <div class="step"><div class="step-num">1</div><div class="step-body"><strong>Product A NRV</strong><p>60,000 − 8,000 = ₦52,000 &gt; Cost ₦45,000. Use cost.</p><div class="step-result">Value = ₦45,000</div></div></div>
      <div class="step"><div class="step-num">2</div><div class="step-body"><strong>Product B NRV</strong><p>35,000 − 7,000 − 3,000 = ₦25,000 &lt; Cost ₦30,000. Write down!</p><div class="step-result">Value = NRV = ₦25,000 (write-down = ₦5,000)</div></div></div>
      <div class="step"><div class="step-num">3</div><div class="step-body"><strong>Product C NRV</strong><p>28,000 − 4,500 = ₦23,500 &gt; Cost ₦22,000. Use cost.</p><div class="step-result">Value = ₦22,000</div></div></div>
      <div class="step"><div class="step-num">4</div><div class="step-body"><strong>Total Inventory</strong><p>45,000 + 25,000 + 22,000</p><div class="step-result">= ₦92,000</div></div></div>
    </div>
  </div>
</div>`)
